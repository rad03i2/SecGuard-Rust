[package]
name = "secguard"
version = "1.1.0"
edition = "2021"
authors = ["Radwan Abdulhadi Ahmed (@rad03i2)"]
description = "Async TCP port scanner and TLS handshake inspector for authorized network auditing"
license = "MIT"
repository = "https://github.com/rad03i2/SecGuard-Rust"
keywords = ["network", "scanner", "tls", "security", "cli"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
tokio = { version = "1.40", features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
colored = "2.1"
futures = "0.3"
rustls = "0.23"
tokio-rustls = "0.26"
webpki-roots = "0.26"
chrono = { version = "0.4", features = ["serde"] }
