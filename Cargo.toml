[package]
name = "secguard"
version = "1.0.0"
edition = "2021"
authors = ["rad03i2"]
description = "Blazing-Fast Asynchronous Network Port Scanner, SSL/TLS Inspector & Security Auditor in Rust"
license = "MIT"
repository = "https://github.com/rad03i2/SecGuard-Rust"

[dependencies]
tokio = { version = "1.36", features = ["full"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
colored = "2.1"
futures = "0.3"
rustls = "0.22"
webpki-roots = "0.26"
chrono = { version = "0.4", features = ["serde"] }
